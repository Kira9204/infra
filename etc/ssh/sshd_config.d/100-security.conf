Port 22
# On SELinux systems (Like Fedora), to allow SSH on a non-standard port, run:
# sudo semanage port -a -t ssh_port_t -p tcp 9927
Port 9927

#AddressFamily any
ListenAddress 0.0.0.0
ListenAddress ::


# Enable this to enable remote VSCODE SSH access
# You must run sudo semodule -i ./vscode/vscode-ssh.pp
# To make SELinux allow these settings
AllowAgentForwarding yes
AllowTcpForwarding yes


# Disable root login by default
PermitRootLogin no
# Allow root from specific subnets
Match Address 10.0.6.0/24
  PermitRootLogin yes
Match All

